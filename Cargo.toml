[workspace]
resolver = "2"
members = [
    "crates/ogsc-recipes",
    "crates/ogsc-scanner",
    "crates/ogsc-wrappers",
    "crates/ogsc-patcher",
    "crates/ogsc-cli",
    "crates/ogsc-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["Old Games - Second Chance Contributors"]
repository = "https://github.com/Momenzi/ReviveBox"

[workspace.dependencies]
anyhow = "1.0"
bsdiff = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6", features = ["derive"] }
eframe = "0.31"
egui = "0.31"
encoding_rs = "0.8"
glob-match = "0.2"
hex = "0.4"
image = { version = ">=0.25.5, <0.25.7", default-features = false, features = ["png", "jpeg", "webp"] }
md-5 = "0.10"
rayon = "1.12"
rfd = "0.15"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sevenz-rust = "0.6"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2.0"
ureq = "2.12"
url = "2.5"
walkdir = "2.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
ogsc-recipes = { path = "crates/ogsc-recipes" }
ogsc-scanner = { path = "crates/ogsc-scanner" }
ogsc-wrappers = { path = "crates/ogsc-wrappers" }
ogsc-patcher = { path = "crates/ogsc-patcher" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
